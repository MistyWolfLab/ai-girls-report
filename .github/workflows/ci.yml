name: ci

on: [push, pull_request]

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      # CI has no avatars (assets/ is gitignored) - the build must still succeed
      # with initial-letter placeholders. That is the regression being pinned.
      - run: node bin/aig.js build examples/sample-report.json -o sample-report.pdf --cast cast/default.cast.json
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report-pdf
          path: sample-report.pdf
